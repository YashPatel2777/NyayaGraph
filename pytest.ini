[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = reference .venv
pythonpath = .
# Phase 6 (A-46): soak and process tests spend Groq quota and minutes; run them explicitly
# with `pytest -m soak` or `pytest -m process` (a later -m replaces this one).
addopts = -m "not soak and not process"
markers =
    neo4j: needs a running Neo4j server; uses a throwaway database (tests/conftest.py)
    gpu: loads EasyOCR or faster-whisper on CUDA (slow); skipped without CUDA
    ollama: needs Ollama serving EMBED_MODEL
    groq: calls the real Groq API (needs GROQ_API_KEY; uses rate-limited quota)
    soak: Phase 6 soak test against a real server process (Groq quota, minutes); opt-in
    process: Phase 6 restart-recovery test that kills a real server process (GPU, Groq); opt-in
filterwarnings =
    ignore::DeprecationWarning:logfire.*
