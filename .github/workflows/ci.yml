# NyayaGraph CI (v1 definition of done, 05: the golden tests run in CI against a throwaway
# Neo4j database). Decisions in docs/README.md, A-48:
# - Linux runner; Neo4j enterprise 2026.10.2 as a test-only service container (the app itself
#   stays Docker-free). Enterprise is needed for the throwaway test databases.
# - No Groq in CI: tests marked groq (live model) or gpu (CUDA) are excluded, so no API key is
#   stored on GitHub and no free-tier quota is spent. Run those locally (SETUP.md section 10).
# - CPU build of PyTorch (runners have no GPU); Ollama serves nomic-embed-text.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      neo4j:
        image: neo4j:2026.10.2-enterprise
        env:
          NEO4J_AUTH: neo4j/ci-test-password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30

    env:
      APP_ENV: dev
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-password
      NEO4J_DATABASE: neo4j
      OLLAMA_URL: http://localhost:11434
      # Placeholder: no test that runs in CI calls Groq (they are marked groq and excluded).
      GROQ_API_KEY: not-used-in-ci
      FLASHRANK_MODEL: ms-marco-MiniLM-L-12-v2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies (CPU PyTorch first, D-3)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-ui.txt

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-nomic-embed-text-v1

      - name: Install and start Ollama, pull nomic-embed-text
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 2; done
          ollama pull nomic-embed-text

      - name: Create the schema (2.2)
        run: python -m scripts.init_neo4j

      - name: Tests (no Groq, no GPU)
        run: pytest -q -m "not groq and not gpu"
